<section class="section-especial">

  <article class="article-especial">
    <div class="badge-especial">
      <span class="badge-especial__star">★</span>
      Especial del Mes
      <span class="badge-especial__star">★</span>
    </div>

    <h2 class="especial-title">{{ special.name.split(' ')[0] }}<br>
      <span class="especial-title--highlight">{{ special.name.split(' ').slice(1).join(' ') }}</span>
    </h2>

    <p class="especial-tagline">{{ special.tagline }}</p>

    <p class="especial-desc">{{ special.description }}</p>

    <div class="especial-price">{{ special.price }}</div>
  </article>

  <picture class="picture-especial">
    <img [src]="special.image" [alt]="special.name" class="image" />
  </picture>

</section>

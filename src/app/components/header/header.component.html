<header class="header" [class.header--scrolled]="scrolled" [class.header--hidden]="hidden">
  <div class="header__inner">

    <a routerLink="/" class="header__brand">
      <img src="assets/logo.png" alt="Columbia Burger" class="header__logo" />
    </a>

    <!-- Desktop nav -->
    <nav class="header__nav">
      <a class="header__link" routerLink="/menu" routerLinkActive="header__link--active">Menú</a>
      <button class="header__link header__link--btn" (click)="goToContacto()">Contacto</button>
      <a class="header__account" routerLink="/cuenta">Mi cuenta</a>
      <a class="header__cta" [href]="whatsappUrl" target="_blank" rel="noopener">
        <i class="fab fa-whatsapp me-2"></i>Pedir Ahora
      </a>
    </nav>

    <!-- Mobile toggle -->
    <button class="header__toggle" (click)="menuOpen = !menuOpen" aria-label="Abrir menú">
      <span class="header__toggle-bar" [class.open]="menuOpen"></span>
      <span class="header__toggle-bar" [class.open]="menuOpen"></span>
      <span class="header__toggle-bar" [class.open]="menuOpen"></span>
    </button>

  </div>

  <!-- Mobile drawer -->
  <div class="header__mobile-nav" [class.header__mobile-nav--open]="menuOpen">
    <a class="header__mobile-link" routerLink="/menu" (click)="menuOpen = false">Menú</a>
    <button class="header__mobile-link header__mobile-link--btn" (click)="goToContacto()">Contacto</button>
    <a class="header__mobile-link" routerLink="/cuenta" (click)="menuOpen = false">Mi cuenta</a>
    <a class="header__mobile-cta" [href]="whatsappUrl" target="_blank" rel="noopener" (click)="menuOpen = false">
      <i class="fab fa-whatsapp me-2"></i>Pedir Ahora
    </a>
  </div>
</header>

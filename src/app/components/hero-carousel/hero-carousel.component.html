<section class="hero">
  <div id="heroCarousel" class="carousel slide hero__carousel" data-bs-ride="carousel" data-bs-interval="5000">

    <!-- Slides -->
    <div class="carousel-inner hero__inner">
      @for (slide of slides; track slide.image; let i = $index) {
        <div class="carousel-item hero__item" [class.active]="i === 0">
          <img [src]="slide.image" [alt]="slide.alt" class="hero__img" />
          <div class="hero__overlay"></div>
        </div>
      }
    </div>


  </div>

  <!-- Contenido centrado sobre el carrusel -->
  <div class="hero__content">
    <span class="hero__badge">★ Bienvenido a Columbia Burger ★</span>
    <h1 class="hero__title">El Sabor que<br><span class="hero__title--highlight">Conquista</span></h1>
    <p class="hero__subtitle">Hamburguesas artesanales, perros calientes y más.<br>Todo con el sabor colombiano que nos identifica.</p>
    <div class="hero__actions">
      <a routerLink="/menu" class="hero__btn hero__btn--primary">
        Ver Menú <i class="fas fa-arrow-right ms-2"></i>
      </a>
      <a [href]="whatsappUrl" target="_blank" rel="noopener" class="hero__btn hero__btn--wa">
        <i class="fab fa-whatsapp me-2"></i> Pedir Ahora
      </a>
    </div>
  </div>

</section>

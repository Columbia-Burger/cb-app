
    <div class="shell">
      <!-- Left panel -->
      <div class="brand-panel">
        <img src="assets/logo.png" alt="Columbia Burger" class="brand-logo" />
        <h1 class="brand-name">Columbia Burger</h1>
        <p class="brand-sub">Panel Administrativo</p>
        <div class="brand-decor"></div>
      </div>

      <!-- Right panel -->
      <div class="form-panel">
        <div class="form-card">
          <img src="assets/logo.png" alt="Columbia Burger" class="mobile-logo" />
          <div class="form-header">
            <h2>Bienvenido</h2>
            <p>Ingresa tus credenciales para continuar</p>
          </div>

          <form (ngSubmit)="onSubmit()" autocomplete="off">
            <div class="field">
              <label for="email">Correo electrónico</label>
              <div class="input-wrap">
                <span class="input-icon">✉</span>
                <input
                  id="email"
                  type="email"
                  [(ngModel)]="email"
                  name="email"
                  placeholder="admin@columbiaburger.com"
                  required
                  [disabled]="loading()"
                />
              </div>
            </div>

            <div class="field">
              <label for="password">Contraseña</label>
              <div class="input-wrap">
                <span class="input-icon">🔒</span>
                <input
                  id="password"
                  type="password"
                  [(ngModel)]="password"
                  name="password"
                  placeholder="••••••••"
                  required
                  [disabled]="loading()"
                />
              </div>
            </div>

            @if (error()) {
              <div class="error-msg">{{ error() }}</div>
            }

            <button type="submit" [disabled]="loading()" class="btn-submit">
              @if (loading()) {
                <span class="spinner"></span> Ingresando...
              } @else {
                Ingresar
              }
            </button>
          </form>
        </div>
      </div>
    </div>

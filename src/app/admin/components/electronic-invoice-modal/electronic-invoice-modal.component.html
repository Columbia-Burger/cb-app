<div class="modal-overlay" (click)="cancelled.emit()">
  <div class="modal" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h3 class="modal-title">Factura electronica - Pedido #{{ order.id }}</h3>
      <button class="modal-close" (click)="cancelled.emit()">X</button>
    </div>

    <div class="modal-body">
      <div class="toggle-row">
        <button class="toggle-btn" [class.active]="useConsumidorFinal()" (click)="useConsumidorFinal.set(true)">
          Consumidor Final
        </button>
        <button class="toggle-btn" [class.active]="!useConsumidorFinal()" (click)="useConsumidorFinal.set(false)">
          Con datos del cliente
        </button>
      </div>

      @if (!useConsumidorFinal()) {
        <div class="fields">
          <label class="field">
            <span>Medio de pago</span>
            <select [(ngModel)]="paymentMethodCode">
              <option value="10">Efectivo</option>
              <option value="47">Transferencia Bancolombia</option>
              <option value="48">Pago con tarjeta</option>
            </select>
          </label>
          <label class="field">
            <span>Tipo de documento</span>
            <select [(ngModel)]="documentType">
              <option value="CC">Cedula</option>
              <option value="NIT">NIT</option>
            </select>
          </label>
          <label class="field">
            <span>{{ identificationLabel }}</span>
            <input [(ngModel)]="identification" [placeholder]="documentType === 'NIT' ? 'Ej: 900123456' : 'Ej: 1234567890'" />
          </label>
          <label class="field">
            <span>{{ customerNameLabel }}</span>
            <input [(ngModel)]="customerName" [placeholder]="documentType === 'NIT' ? 'Ej: Empresa SAS' : 'Ej: Juan Perez'" />
          </label>
          <label class="field">
            <span>Correo (para envio)</span>
            <input [(ngModel)]="customerEmail" type="email" placeholder="cliente@correo.com" />
          </label>
        </div>
      } @else {
        <p class="consumidor-info">
          Se emitira a nombre de <strong>Consumidor Final</strong> con identificacion <strong>222222222222</strong>.
        </p>
      }

      @if (error()) {
        <div class="alert-error">{{ error() }}</div>
      }
    </div>

    <div class="modal-footer">
      <button class="btn-cancel" (click)="cancelled.emit()">Cancelar</button>
      <button class="btn-submit" [disabled]="loading()" (click)="submit()">
        {{ loading() ? 'Generando...' : 'Generar factura electronica' }}
      </button>
    </div>
  </div>
</div>

spring.application.name=cb-api-business

# ── Server ───────────────────────────────────────────────────
server.port=${PORT:8081}

# ── Database ─────────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}?currentSchema=business
spring.datasource.username=${PGUSER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate ──────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.default_schema=business

# ── CORS ─────────────────────────────────────────────────────
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,https://columbia-burger-front.vercel.app,https://cb-front-end-production.up.railway.app}

# ── JWT ──────────────────────────────────────────────────────
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ── Admin credentials ────────────────────────────────────────
app.admin.email=${ADMIN_EMAIL}
app.admin.password=${ADMIN_PASSWORD}

# ── Kitchen credentials ───────────────────────────────────────
app.kitchen.email=${KITCHEN_EMAIL}
app.kitchen.password=${KITCHEN_PASSWORD}

# ── Delivery credentials ──────────────────────────────────────
app.delivery.email=${DELIVERY_EMAIL}
app.delivery.password=${DELIVERY_PASSWORD}

# ── Server URL (Swagger) ─────────────────────────────────────
app.server-url=${APP_SERVER_URL:http://localhost:8081}

# ── Catalog API (proxy) ──────────────────────────────────────
catalog.api.url=${CATALOG_API_URL:https://cb-data-api-production.up.railway.app}
catalog.api.key=${CATALOG_API_KEY}

# ── OTP WhatsApp (n8n webhook) ───────────────────────────────
n8n.otp.webhook.url=${N8N_OTP_WEBHOOK_URL:https://n8n-production-76cd.up.railway.app/webhook/f4c47f5a-51f8-4e47-8c44-001bd85d3384}

# ── SpringDoc / Swagger ──────────────────────────────────────
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}

# ── Logging ──────────────────────────────────────────────────
logging.level.com.columbiaburger.business.security=INFO

# ── Anthropic / Claude API ───────────────────────────────────
anthropic.api-key=${ANTHROPIC_API_KEY:}

# ── Instagram Graph API ──────────────────────────────────────
instagram.account-id=${INSTAGRAM_ACCOUNT_ID:}
instagram.access-token=${INSTAGRAM_ACCESS_TOKEN:}

# ── WhatsApp Business API ────────────────────────────────────
whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:}
whatsapp.access-token=${WHATSAPP_ACCESS_TOKEN:}

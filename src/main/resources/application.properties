spring.application.name=cb-back-end

# ── Server ──────────────────────────────────────────────
server.port=${PORT:8080}

# ── Database (Railway injects DATABASE_URL) ─────────────
spring.datasource.url=${DATABASE_URL}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate ──────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ── CORS ─────────────────────────────────────────────────
# Comma-separated list of allowed origins
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# ── API Key ──────────────────────────────────────────────
# Definir en Railway como variable de entorno: API_KEY=<secret>
app.security.api-key=${API_KEY}

# ── SpringDoc / Swagger ──────────────────────────────────
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha

@if (special(); as s) {
  <section class="section-especial">

    <article class="article-especial">
      <div class="badge-especial">
        <span class="badge-especial__star">★</span>
        Especial del Mes
        <span class="badge-especial__star">★</span>
      </div>

      <h2 class="especial-title">{{ s.name.split(' ')[0] }}<br>
        <span class="especial-title--highlight">{{ s.name.split(' ').slice(1).join(' ') }}</span>
      </h2>

      <p class="especial-tagline">{{ s.tagline }}</p>

      <p class="especial-desc">{{ s.description }}</p>

      <div class="especial-price">{{ s.price }}</div>
    </article>

    <picture class="picture-especial">
      <img [src]="s.image" [alt]="s.name" class="image" loading="lazy" />
    </picture>

  </section>
}

<div class="admin-shell">

  <!-- Barra superior: solo en celular -->
  <header class="topbar">
    <button class="icon-btn" (click)="sidebarOpen.set(!sidebarOpen())" [attr.aria-label]="sidebarOpen() ? 'Cerrar menú' : 'Abrir menú'">
      <app-icon [name]="sidebarOpen() ? 'close' : 'hamburger'" [size]="22" />
    </button>
    <div class="topbar-brand">
      <img src="assets/icons/favicon-48.png" alt="" class="brand-logo brand-logo--sm" />
      <span>Columbia Burger</span>
    </div>
  </header>

  @if (sidebarOpen()) {
    <div class="overlay" (click)="sidebarOpen.set(false)"></div>
  }

  <aside class="sidebar" [class.open]="sidebarOpen()">
    <div class="sidebar-brand">
      <img src="assets/icons/favicon-48.png" alt="" class="brand-logo" />
      <div class="brand-text">
        <span class="brand-name">Columbia Burger</span>
        <span class="brand-sub">Administración</span>
      </div>
    </div>

    <nav class="sidebar-nav" aria-label="Secciones del panel">
      @for (group of nav; track group.title) {
        <div class="nav-group">
          <span class="nav-group__title">{{ group.title }}</span>
          @for (item of group.items; track item.path) {
            <a [routerLink]="item.path" routerLinkActive="active" (click)="sidebarOpen.set(false)">
              <app-icon [name]="item.icon" />
              <span>{{ item.label }}</span>
            </a>
          }
        </div>
      }
    </nav>

    <div class="sidebar-user">
      <div class="avatar">{{ username.charAt(0).toUpperCase() }}</div>
      <div class="user-text">
        <span class="user-name">{{ username }}</span>
        <span class="user-role">Administrador</span>
      </div>
      <button class="icon-btn icon-btn--subtle" (click)="logout()" title="Cerrar sesión" aria-label="Cerrar sesión">
        <app-icon name="logout" />
      </button>
    </div>
  </aside>

  <main class="admin-content">
    <router-outlet />
  </main>
</div>

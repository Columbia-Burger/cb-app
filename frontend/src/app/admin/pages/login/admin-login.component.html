<div class="login-wrapper">
  <div class="glow" aria-hidden="true"></div>

  <main class="login-card">
    <div class="brand">
      <img src="assets/icons/icon-192.png" alt="" class="brand-logo" />
      <div>
        <h1 class="brand-title">Columbia Burger</h1>
        <p class="brand-sub">Panel de administración</p>
      </div>
    </div>

    <form (ngSubmit)="onSubmit()" class="form">
      <label class="field">
        <span class="field__label">Usuario</span>
        <span class="field__control">
          <app-icon name="user" />
          <input
            type="text"
            [(ngModel)]="username"
            name="username"
            placeholder="Tu usuario"
            autocomplete="username"
            autocapitalize="none"
            autocorrect="off"
            spellcheck="false"
            required
            [disabled]="loading()"
          />
        </span>
      </label>

      <label class="field">
        <span class="field__label">Contraseña</span>
        <span class="field__control">
          <app-icon name="lock" />
          <input
            [type]="showPassword() ? 'text' : 'password'"
            autocomplete="current-password"
            [(ngModel)]="password"
            name="password"
            placeholder="Tu contraseña"
            required
            [disabled]="loading()"
          />
          <button type="button" class="reveal" (click)="showPassword.set(!showPassword())"
                  [attr.aria-label]="showPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'">
            <app-icon [name]="showPassword() ? 'eye-off' : 'eye'" />
          </button>
        </span>
      </label>

      @if (error()) {
        <div class="notice" role="alert"><app-icon name="alert" [size]="16" /> {{ error() }}</div>
      }

      <button type="submit" class="submit" [disabled]="loading() || !username.trim() || !password">
        @if (loading()) { <span class="spinner"></span> Ingresando… } @else { Ingresar }
      </button>
    </form>
  </main>

  <p class="footnote">¿Olvidaste tu contraseña? Pídele a un administrador que la cambie en Usuarios.</p>
</div>

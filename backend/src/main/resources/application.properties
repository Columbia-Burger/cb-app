spring.application.name=cb-api-business

# ── Server ───────────────────────────────────────────────────
server.port=${PORT:8081}

# ── Database ─────────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}?currentSchema=business
spring.datasource.username=${PGUSER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate ──────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.default_schema=business
spring.jpa.properties.hibernate.jdbc.time_zone=America/Bogota
spring.jackson.time-zone=America/Bogota

# ── CORS ─────────────────────────────────────────────────────
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,https://columbia-burger-front.vercel.app,https://cb-front-end-production.up.railway.app}

# ── JWT ──────────────────────────────────────────────────────
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ── Cuentas iniciales (solo para crear admin/cocina/domicilio si no hay usuarios; ver UserService) ──
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

app.kitchen.email=${KITCHEN_EMAIL:}
app.kitchen.password=${KITCHEN_PASSWORD:}

app.delivery.email=${DELIVERY_EMAIL:}
app.delivery.password=${DELIVERY_PASSWORD:}

# ── Server URL (Swagger) ─────────────────────────────────────
app.server-url=${APP_SERVER_URL:http://localhost:8081}


# ── OTP WhatsApp (n8n webhook) ───────────────────────────────
n8n.otp.webhook.url=${N8N_OTP_WEBHOOK_URL:https://n8n-production-76cd.up.railway.app/webhook/f4c47f5a-51f8-4e47-8c44-001bd85d3384}

# ── SpringDoc / Swagger ──────────────────────────────────────
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}

# ── Logging ──────────────────────────────────────────────────
logging.level.com.columbiaburger.business.security=INFO

# ── Anthropic / Claude API ───────────────────────────────────
anthropic.api-key=${ANTHROPIC_API_KEY:}

# ── Instagram Graph API ──────────────────────────────────────
instagram.account-id=${INSTAGRAM_ACCOUNT_ID:}
instagram.access-token=${INSTAGRAM_ACCESS_TOKEN:}

# ── WhatsApp Business API ────────────────────────────────────
whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:}
whatsapp.access-token=${WHATSAPP_ACCESS_TOKEN:}

# ── Factus (facturación electrónica) ─────────────────────────
factus.base-url=${FACTUS_BASE_URL:https://api-sandbox.factus.com.co}
factus.client-id=${FACTUS_CLIENT_ID:}
factus.client-secret=${FACTUS_CLIENT_SECRET:}
factus.username=${FACTUS_USERNAME:}
factus.password=${FACTUS_PASSWORD}
factus.numbering-range-id=${FACTUS_NUMBERING_RANGE_ID:389}
# Impuesto por ítem: 01 = IVA, 04 = INC (impuesto al consumo). Confirmar con contador según RUT.
factus.tax-code=${FACTUS_TAX_CODE:01}
factus.tax-rate=${FACTUS_TAX_RATE:0.00}
factus.municipality-code=${FACTUS_MUNICIPALITY_CODE:11001}
